<svg xmlns="http://www.w3.org/2000/svg" width="660" height="210" viewBox="0 0 660 210" role="img" aria-label="Energy per solved task on the same 35B model: rigby 15.7 kilojoules at 154 watts for 102 seconds, BigHonker 10.9 kilojoules at about 186 watts for 58 seconds, Mothership 3.9 kilojoules at about 418 watts for 9.4 seconds.">
<style>
.node{fill:#f6f6f4;stroke:#1f2328;stroke-width:1.2}.node.decide{stroke:#2563a8;stroke-width:2.2}.node.advise{stroke:#2563a8;stroke-width:1.6;stroke-dasharray:4 3}
.group{fill:none;stroke:#5f6670;stroke-width:1;stroke-dasharray:5 4}.edge{fill:none;stroke:#1f2328;stroke-width:1.4}.edge.soft{stroke:#5f6670;stroke-dasharray:5 4}
.t{font:600 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}.s,.lbl{font:400 11px Consolas,'Courier New',monospace;fill:#5f6670}.grp{font:500 11px Consolas,'Courier New',monospace;fill:#4a4f57;letter-spacing:.08em}
.m{font:400 12px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}.ah{fill:#1f2328}.ah.soft{fill:#5f6670}.bar{fill:#2563a8}.grid{stroke:#e4e2dc;stroke-width:1}
.val{font:600 12px Consolas,'Courier New',monospace;fill:#1f2328}.col{fill:#f6f6f4;stroke:#e4e2dc;stroke-width:1}.colhead{fill:#f6f6f4;stroke:#1f2328;stroke-width:1.2}
</style>
<rect x="0" y="0" width="660" height="210" fill="#ffffff"/>
<line class="grid" x1="190" y1="18" x2="190" y2="172"/>
        <line class="grid" x1="290" y1="18" x2="290" y2="172"/>
        <line class="grid" x1="390" y1="18" x2="390" y2="172"/>
        <line class="grid" x1="490" y1="18" x2="490" y2="172"/>
        <line class="grid" x1="590" y1="18" x2="590" y2="172"/>
        <text class="lbl" x="190" y="190" text-anchor="middle">0</text>
        <text class="lbl" x="290" y="190" text-anchor="middle">4</text>
        <text class="lbl" x="390" y="190" text-anchor="middle">8</text>
        <text class="lbl" x="490" y="190" text-anchor="middle">12</text>
        <text class="lbl" x="590" y="190" text-anchor="middle">16 kJ</text>
        <text class="t" x="180" y="44" text-anchor="end">rigby</text>
        <text class="s" x="180" y="58" text-anchor="end">154 W × 102 s</text>
        <path class="bar" d="M190,30 h388.5 a4,4 0 0 1 4,4 v22 a4,4 0 0 1 -4,4 h-388.5 z"><title>rigby: 15.7 kJ per solved task, whole box (154 W for 102 s)</title></path>
        <text class="val" x="590.5" y="50">15.7</text>
        <text class="t" x="180" y="94" text-anchor="end">BigHonker</text>
        <text class="s" x="180" y="108" text-anchor="end">~186 W × 58 s</text>
        <path class="bar" d="M190,80 h268.5 a4,4 0 0 1 4,4 v22 a4,4 0 0 1 -4,4 h-268.5 z"><title>BigHonker: 10.9 kJ per solved task, whole box (about 186 W for 58 s)</title></path>
        <text class="val" x="470.5" y="100">10.9</text>
        <text class="t" x="180" y="144" text-anchor="end">Mothership</text>
        <text class="s" x="180" y="158" text-anchor="end">~418 W × 9.4 s</text>
        <path class="bar" d="M190,130 h93.5 a4,4 0 0 1 4,4 v22 a4,4 0 0 1 -4,4 h-93.5 z"><title>Mothership: 3.9 kJ per solved task, whole box (about 418 W for 9.4 s)</title></path>
        <text class="val" x="295.5" y="150">3.9</text>
</svg>
